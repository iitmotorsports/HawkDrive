[project]
name = "hawkdrive"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "cantools==45.1.2",
    "mashumaro>=3.23",
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "typer>=0.23.2",
]

[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project.scripts]
hawkdrive = "hawkdrive.cli:main"
hd = "hawkdrive.cli:main"
